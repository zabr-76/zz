<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Moderno - z-jackett</title>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ff6b35;
            --accent-hover: #ff8c5a;
            --border: #404040;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent), #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .crud-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 768px) {
            .crud-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Form Styles */
        .form-section {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.1);
        }

        .form-section h2 {
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* List Styles */
        .list-section {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.1);
        }

        .list-section h2 {
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid var(--accent);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .item-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .item-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .item-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .item-category {
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .item-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .item-price {
            font-size: 1.125rem;
            font-weight: bold;
            color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        /* Icons */
        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Tienda CRUD</h1>
            <p>Gestiona tus productos con z-jackett - Framework Reactivo</p>
        </div>

        <div z-app z-data="crudApp()" class="crud-grid">
            <!-- Formulario -->
            <div class="form-section fade-in">
                <h2>
                    <span z-text="editingIndex === null ? '➕ Agregar Producto' : '✏️ Editar Producto'"></span>
                </h2>
                
                <form @submit.prevent="saveProduct()">
                    <div class="form-group">
                        <label for="name">Nombre del Producto</label>
                        <input 
                            type="text" 
                            id="name"
                            z-model="form.name"
                            class="form-control" 
                            placeholder="Ej: Laptop Gaming"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Categoría</label>
                        <select 
                            id="category"
                            z-model="form.category" 
                            class="form-control"
                            required
                        >
                            <option value="">Seleccionar categoría</option>
                            <option value="Tecnología">💻 Tecnología</option>
                            <option value="Hogar">🏠 Hogar</option>
                            <option value="Ropa">👕 Ropa</option>
                            <option value="Deportes">⚽ Deportes</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Precio ($)</label>
                        <input 
                            type="number" 
                            id="price"
                            z-model.number="form.price"
                            class="form-control" 
                            placeholder="0.00"
                            step="0.01"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción</label>
                        <textarea 
                            id="description"
                            z-model="form.description"
                            class="form-control" 
                            rows="3"
                            placeholder="Describe el producto..."
                        ></textarea>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <span z-text="editingIndex === null ? '💾 Guardar' : '🔄 Actualizar'"></span>
                        </button>
                        
                        <button 
                            type="button" 
                            class="btn btn-secondary" 
                            @click="resetForm()"
                            z-show="editingIndex !== null"
                        >
                            ❌ Cancelar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Lista de Productos -->
            <div class="list-section fade-in">
                <h2>📦 Productos Registrados</h2>
                
                <!-- Estadísticas -->
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" z-text="products.length"></div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" z-text="totalValue.toFixed(2)"></div>
                        <div class="stat-label">Valor Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" z-text="categories.length"></div>
                        <div class="stat-label">Categorías</div>
                    </div>
                </div>

                <!-- Lista -->
                <div class="items-list">
                    <template z-for="product in products" :key="product.id">
                        <div class="item-card fade-in">
                            <div class="item-header">
                                <div class="item-title" z-text="product.name"></div>
                                <div class="item-category" z-text="product.category"></div>
                            </div>
                            
                            <div class="item-description" z-text="product.description"></div>
                            
                            <div class="item-footer">
                                <div class="item-price" z-text="'$' + product.price.toFixed(2)"></div>
                                <div class="btn-group">
                                    <button 
                                        class="btn btn-secondary" 
                                        @click="editProduct(product.id)"
                                        title="Editar"
                                    >
                                        ✏️
                                    </button>
                                    <button 
                                        class="btn btn-danger" 
                                        @click="deleteProduct(product.id)"
                                        title="Eliminar"
                                    >
                                        🗑️
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Estado vacío -->
                    <div class="empty-state" z-show="products.length === 0">
                        <div>📭</div>
                        <h3>No hay productos</h3>
                        <p>Agrega tu primer producto usando el formulario</p>
                    </div>
                </div>

                <!-- Acciones globales -->
                <div class="btn-group" style="margin-top: 2rem;" z-show="products.length > 0">
                    <button class="btn btn-success" @click="exportData()">
                        📤 Exportar JSON
                    </button>
                    <button class="btn btn-secondary" @click="importData()">
                        📥 Importar JSON
                    </button>
                    <button class="btn btn-danger" @click="clearAll()">
                        🗑️ Limpiar Todo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="z-jackett.js"></script>

    <script>
        function crudApp() {
            return {
                // Estado de la aplicación
                products: [
                    {
                        id: 1,
                        name: "Laptop Gaming",
                        category: "Tecnología",
                        price: 1200.00,
                        description: "Laptop potente para gaming y trabajo"
                    },
                    {
                        id: 2,
                        name: "Auriculares Bluetooth",
                        category: "Tecnología",
                        price: 89.99,
                        description: "Sonido de alta calidad sin cables"
                    },
                    {
                        id: 3,
                        name: "Silla Ergonómica",
                        category: "Hogar",
                        price: 299.50,
                        description: "Comodidad para largas horas de trabajo"
                    }
                ],
                
                // Formulario
                form: {
                    name: "",
                    category: "",
                    price: 0,
                    description: ""
                },
                
                // Control de edición
                editingIndex: null,
                
                // Propiedades computadas
                get totalValue() {
                    return this.products.reduce((total, product) => total + product.price, 0);
                },
                
                get categories() {
                    const uniqueCategories = new Set(this.products.map(p => p.category));
                    return Array.from(uniqueCategories);
                },
                
                // Métodos CRUD
                saveProduct() {
                    if (this.editingIndex === null) {
                        // Crear nuevo producto
                        const newProduct = {
                            id: Date.now(), // ID único basado en timestamp
                            ...this.form
                        };
                        this.products.push(newProduct);
                    } else {
                        // Actualizar producto existente
                        this.products[this.editingIndex] = {
                            ...this.products[this.editingIndex],
                            ...this.form
                        };
                    }
                    
                    this.resetForm();
                },
                
                editProduct(productId) {
                    const index = this.products.findIndex(p => p.id === productId);
                    if (index !== -1) {
                        this.form = { ...this.products[index] };
                        this.editingIndex = index;
                    }
                },
                
                deleteProduct(productId) {
                    if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                        const index = this.products.findIndex(p => p.id === productId);
                        if (index !== -1) {
                            this.products.splice(index, 1);
                        }
                    }
                },
                
                resetForm() {
                    this.form = {
                        name: "",
                        category: "",
                        price: 0,
                        description: ""
                    };
                    this.editingIndex = null;
                },
                
                clearAll() {
                    if (confirm('¿Estás seguro de que quieres eliminar todos los productos?')) {
                        this.products = [];
                    }
                },
                
                exportData() {
                    const dataStr = JSON.stringify(this.products, null, 2);
                    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                    
                    const exportFileDefaultName = 'productos.json';
                    
                    const linkElement = document.createElement('a');
                    linkElement.setAttribute('href', dataUri);
                    linkElement.setAttribute('download', exportFileDefaultName);
                    linkElement.click();
                },
                
                importData() {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    
                    input.onchange = e => {
                        const file = e.target.files[0];
                        const reader = new FileReader();
                        
                        reader.onload = event => {
                            try {
                                const importedData = JSON.parse(event.target.result);
                                if (Array.isArray(importedData)) {
                                    this.products = importedData;
                                    alert('Productos importados correctamente!');
                                } else {
                                    alert('El archivo no contiene datos válidos');
                                }
                            } catch (error) {
                                alert('Error al importar el archivo: ' + error.message);
                            }
                        };
                        
                        reader.readAsText(file);
                    };
                    
                    input.click();
                },
                
                // Utilidades
                generateId() {
                    return Math.max(0, ...this.products.map(p => p.id)) + 1;
                }
            };
        }
    </script>
</body>
</html>
